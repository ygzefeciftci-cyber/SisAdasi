<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071318">
<title>Sis Adası</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#071318; --bg2:#0e2229; --ink:#e8f0ea; --dim:#8da7a5; --accent:#f2c46d; --accent-ink:#2a1d05;
  --line:rgba(232,240,234,.15); --card:rgba(14,34,41,.74); --bad:#e58a7a; --ok:#7fd1a8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--sans);
  background:linear-gradient(180deg,#05100f 0%,#0b1f26 55%,#10292f 100%);overflow-x:hidden}
.fog,.beam{position:fixed;pointer-events:none;z-index:0}
.fog{inset:-20%;background:
  radial-gradient(40% 30% at 20% 30%,rgba(190,215,210,.10),transparent 70%),
  radial-gradient(45% 35% at 80% 65%,rgba(190,215,210,.09),transparent 70%),
  radial-gradient(35% 25% at 50% 90%,rgba(190,215,210,.08),transparent 70%);
  animation:drift 40s ease-in-out infinite alternate}
.beam{top:-45vmax;right:-45vmax;width:100vmax;height:100vmax;mix-blend-mode:screen;
  background:conic-gradient(from 0deg,transparent 0 335deg,rgba(242,196,109,.11) 347deg,transparent 360deg);
  animation:sweep 11s linear infinite}
@keyframes drift{to{transform:translate3d(6%,3%,0) scale(1.08)}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fog,.beam{animation:none}.enter>*{animation:none!important}}

#shell{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.logo{font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hdr-right{display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px rgba(229,138,122,.18)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(127,209,168,.18)}
.link{background:none;border:0;color:var(--dim);font:inherit;font-size:.85rem;padding:8px 4px;cursor:pointer;min-height:40px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stack>*+*{margin-top:14px}
h1,h2{font-family:var(--serif);font-weight:500;margin:0}
h1{font-size:2.3rem;line-height:1.1}
h2{font-size:1.35rem;color:var(--accent)}
.lead{font-family:var(--serif);color:var(--dim);font-size:1.05rem;line-height:1.6;margin:10px 0 0}
label{display:block;font-size:.82rem;color:var(--dim);margin:0 0 6px}
input{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:rgba(5,16,15,.55);color:var(--ink);font:inherit;font-size:1.05rem;padding:0 14px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
input.code{text-transform:uppercase;letter-spacing:.35em;text-align:center;font-weight:600}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:1.02rem;padding:0 18px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hint{font-size:.85rem;color:var(--dim);line-height:1.5;margin:0}
.hint.center{text-align:center}

.roomcode{font-family:var(--serif);font-size:3rem;letter-spacing:.28em;text-align:center;color:var(--accent);margin:4px 0 16px;padding-left:.28em}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.plist .ic{font-size:1.6rem;line-height:1;width:34px;text-align:center}
.plist .nm{font-weight:650}
.plist .rl{font-size:.8rem;color:var(--accent);margin-left:6px}
.plist .bl{font-size:.82rem;color:var(--dim);margin-top:2px;line-height:1.4}
.plist li.off{opacity:.45}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--dim)}

.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(14,34,41,.6);border-radius:99px;padding:6px 11px;font-size:.85rem}
.chip.off{opacity:.4}.chip.voted{border-color:rgba(127,209,168,.55)}
.chip .ok{color:var(--ok);font-weight:700}

.prev{border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 16px;color:var(--dim);font-size:.9rem;line-height:1.5}
.prev b{color:var(--ink);font-weight:600}
.scene h2{margin-bottom:12px;font-size:.8rem;letter-spacing:.24em;text-transform:uppercase}
.scene p{font-family:var(--serif);font-size:1.14rem;line-height:1.72;margin:0 0 14px}
.enter>*{animation:rise .6s both;animation-delay:calc(var(--i,0)*.14s)}

.choices{display:grid;gap:10px;margin-top:6px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;min-height:56px;padding:12px 14px;
  border-radius:12px;border:1px solid var(--line);background:rgba(5,16,15,.5);color:var(--ink);font:inherit;font-size:1rem;line-height:1.35;cursor:pointer}
.choice:active{transform:scale(.99)}
.choice.mine{border-color:var(--accent);background:rgba(242,196,109,.12)}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.choice small{display:block;color:var(--dim);font-size:.78rem;margin-top:3px}
.pips{display:flex;gap:4px;flex-shrink:0}
.pip{width:11px;height:11px;border-radius:50%;background:var(--accent)}

.end{text-align:center}
.end .big{font-family:var(--serif);font-size:1.6rem;color:var(--accent);margin:8px 0 18px;letter-spacing:.04em}
.hist{margin:0;padding:0;list-style:none;text-align:left;font-size:.88rem;color:var(--dim)}
.hist li{padding:8px 0;border-top:1px solid var(--line);line-height:1.4}
.hist b{color:var(--ink);font-weight:600}

#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:5;
  background:#12303a;border:1px solid var(--line);color:var(--ink);padding:11px 16px;border-radius:12px;font-size:.92rem;max-width:90vw;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}

/* --- 3D Ada dünyası --- */
#world3d{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(circle at 50% 30%,#193a42 0%,#071318 58%,#03090b 100%)}
#world3d canvas{width:100%;height:100%;display:block;opacity:.92}
.world-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 34%,rgba(0,0,0,.16) 66%,rgba(0,0,0,.72) 100%)}
.world-haze{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,12,14,.18),transparent 35%,rgba(3,9,11,.58) 100%)}
#shell{z-index:2}
.card{box-shadow:0 20px 70px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.025)}
.logo{text-shadow:0 0 18px rgba(242,196,109,.25)}
</style>
</head>
<body>
<div id="world3d" aria-hidden="true"><canvas id="worldCanvas"></canvas><div class="world-vignette"></div><div class="world-haze"></div></div>
<div class="fog"></div><div class="beam"></div>
<div id="shell">
  <header>
    <div class="logo">Sis Adası</div>
    <div class="hdr-right"><button class="link" id="leave" hidden>Çık</button><span class="dot" id="dot" title="Bağlantı"></span></div>
  </header>
  <main id="app" class="stack"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
let pid = store.get('sa_pid');
if (!pid) { pid = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); store.set('sa_pid', pid); }

let ws = null, state = null, retry = 0, lastKey = '', prefillCode = new URLSearchParams(location.search).get('oda') || '';
window.__SA_GET_STATE = () => state;

// ---- küçük DOM yardımcısı (metinler hep textContent olarak girer) ----
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return el;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---- bağlantı ----
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => {
    retry = 0; $('#dot').classList.add('on');
    const code = store.get('sa_room'), name = store.get('sa_name');
    if (code && name) send({ t: 'join', code, name, pid, silent: true });
  };
  ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch { return; } onServer(m); };
  ws.onclose = () => { $('#dot').classList.remove('on'); setTimeout(connect, Math.min(5000, 400 * 2 ** retry++)); };
}
function send(o) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); else toast('Bağlantı yok, yeniden deneniyor…');
}

function onServer(m) {
  if (m.t === 'state') {
    state = m; store.set('sa_room', m.code);
    history.replaceState(null, '', `?oda=${m.code}`);
    render();
  } else if (m.t === 'error') {
    if (m.code === 'nojoin') { store.del('sa_room'); state = null; render(); }
    else toast(m.msg || 'Bir şeyler ters gitti.');
  } else if (m.t === 'left') {
    store.del('sa_room'); state = null; prefillCode = ''; history.replaceState(null, '', location.pathname); render();
  }
}

// ---- görünümler ----
function homeView() {
  const name = h('input', { id: 'name', maxlength: 16, autocomplete: 'nickname', placeholder: 'Takma adın', value: store.get('sa_name') || '' });
  const code = h('input', { id: 'code', class: 'code', maxlength: 4, autocapitalize: 'characters', autocomplete: 'off', placeholder: 'KOD', value: prefillCode.toUpperCase() });
  const getName = () => {
    const n = name.value.trim();
    if (!n) { name.focus(); toast('Önce bir takma ad yaz.'); return null; }
    store.set('sa_name', n); return n;
  };
  return h('div', { class: 'stack' },
    h('div', { class: 'card' },
      h('h1', {}, 'Sis Adası'),
      h('p', { class: 'lead' }, 'Gece yarısı, sisin ortasında feribotunuz duruyor. Uzaktaki terk edilmiş fener hâlâ yanıyor. 1–4 kişilik ortak bir hikâye: birlikte oy verin, birlikte hayatta kalın.')),
    h('div', { class: 'card stack' },
      h('div', {}, h('label', { for: 'name' }, 'Adın'), name),
      h('button', { class: 'btn', onclick: () => { const n = getName(); if (n) send({ t: 'create', name: n, pid }); } }, 'Yeni oda kur'),
      h('p', { class: 'hint center' }, 'ya da arkadaşının kodunu gir'),
      h('div', { class: 'row' }, code,
        h('button', { class: 'btn ghost', onclick: () => {
          const n = getName(); if (!n) return;
          const c = code.value.trim().toUpperCase();
          if (c.length !== 4) { code.focus(); toast('Kod 4 harfli.'); return; }
          send({ t: 'join', code: c, name: n, pid });
        } }, 'Katıl'))));
}

function me() { return state.players.find((p) => p.id === state.you); }
function isHost() { return state.hostId === state.you; }

function lobbyView() {
  const link = `${location.origin}/?oda=${state.code}`;
  const share = async () => {
    const data = { title: 'Sis Adası', text: `Sis Adası’nda bana katıl! Oda kodu: ${state.code}`, url: link };
    try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(link); toast('Bağlantı kopyalandı.'); } catch { toast(link); }
  };
  return h('div', { class: 'stack' },
    h('div', { class: 'card' },
      h('p', { class: 'hint center' }, 'Oda kodu'),
      h('div', { class: 'roomcode' }, state.code),
      h('button', { class: 'btn ghost', onclick: share }, 'Arkadaşlarını çağır')),
    h('div', { class: 'card' },
      h('h2', {}, `Mürettebat (${state.players.length}/${state.maxPlayers})`),
      h('ul', { class: 'plist' }, state.players.map((p) => {
        const r = state.roles[p.role] || { icon: '👤', name: '', blurb: '' };
        return h('li', { class: p.connected ? '' : 'off' },
          h('div', { class: 'ic' }, r.icon),
          h('div', {},
            h('div', {}, h('span', { class: 'nm' }, p.name), h('span', { class: 'rl' }, r.name),
              p.id === state.you && h('span', { class: 'tag' }, 'sen'), p.id === state.hostId && h('span', { class: 'tag' }, 'kurucu')),
            h('div', { class: 'bl' }, r.blurb)));
      }))),
    isHost()
      ? h('div', { class: 'stack' },
          h('button', { class: 'btn', onclick: () => send({ t: 'start' }) }, 'Hikâyeyi başlat'),
          h('p', { class: 'hint center' }, state.players.length < 2 ? 'Tek başına da oynayabilirsin, ama 2–4 kişi daha eğlenceli.' : 'Herkes hazırsa başlat.'))
      : h('p', { class: 'hint center' }, 'Kurucunun hikâyeyi başlatması bekleniyor…'));
}

function strip() {
  return h('div', { class: 'strip' }, state.players.map((p) => {
    const r = state.roles[p.role] || { icon: '👤' };
    return h('div', { class: `chip ${p.connected ? '' : 'off'} ${p.voted ? 'voted' : ''}` },
      r.icon, p.name + (p.id === state.you ? ' (sen)' : ''), p.voted && h('span', { class: 'ok' }, '✓'));
  }));
}

function lastResultView() {
  const r = state.lastResult;
  if (!r) return null;
  const tie = r.tie === 'kaptan' ? ' Oylar berabere kaldı, Kaptan’ın sözü geçti.' : r.tie === 'sans' ? ' Oylar berabere kaldı, kader karar verdi.' : '';
  return h('div', { class: 'prev' },
    h('div', {}, h('b', {}, r.choice), ` (${r.tally})`, tie),
    r.narration && h('div', {}, r.narration));
}

function sceneBlock(extraClass) {
  const s = state.scene;
  return h('div', { class: `scene ${extraClass}` }, h('h2', {}, s.title), s.paragraphs.map((t, i) => h('p', { style: `--i:${i}` }, t)));
}

function playView() {
  const s = state.scene, mine = me();
  const waiting = state.players.filter((p) => p.connected && !p.voted).map((p) => p.name);
  const anyVote = state.players.some((p) => p.voted);
  const entering = lastKey !== `${state.code}:${state.step}`;
  return h('div', {},
    strip(), lastResultView(),
    h('div', { class: 'card' },
      sceneBlock(entering ? 'enter' : ''),
      h('div', { class: 'choices' }, s.choices.map((c) =>
        h('button', { class: `choice ${c.mine ? 'mine' : ''}`, disabled: c.locked, onclick: () => send({ t: 'vote', i: c.i }) },
          h('span', {}, c.text, c.locked && h('small', {}, '🔒 ' + c.reason)),
          h('span', { class: 'pips' }, Array.from({ length: c.votes }, () => h('i', { class: 'pip' }))))))),
    h('p', { class: 'hint center', style: 'margin-top:14px' },
      mine && mine.voted ? (waiting.length ? `Bekleniyor: ${waiting.join(', ')}` : '') : 'Bir seçenek seç. Herkes oy verince hikâye devam eder.'),
    isHost() && anyVote && waiting.length
      ? h('button', { class: 'btn ghost', style: 'margin-top:10px', onclick: () => send({ t: 'force' }) }, 'Oylamayı şimdi bitir') : null);
}

function endView() {
  const s = state.scene;
  return h('div', {},
    strip(), lastResultView(),
    h('div', { class: 'card end' },
      sceneBlock('enter'),
      h('div', { class: 'big' }, s.endingTitle || 'SON'),
      isHost()
        ? h('button', { class: 'btn', onclick: () => send({ t: 'restart' }) }, 'Yeniden oyna')
        : h('p', { class: 'hint' }, 'Kurucu yeni bir tur başlatabilir.')),
    h('div', { class: 'card', style: 'margin-top:14px' },
      h('h2', {}, 'Verdiğiniz kararlar'),
      h('ul', { class: 'hist' }, state.history.map((x) => h('li', {}, `${x.scene}: `, h('b', {}, x.choice))))));
}

function render() {
  const app = $('#app'), y = window.scrollY;
  app.replaceChildren();
  $('#leave').hidden = !state;
  if (!state) { app.append(homeView()); lastKey = ''; return; }
  const view = state.phase === 'lobby' ? lobbyView() : state.phase === 'play' ? playView() : endView();
  app.append(view);
  const key = `${state.code}:${state.step}`;
  if (key !== lastKey) { window.scrollTo(0, 0); lastKey = key; } else window.scrollTo(0, y);
  if (state.phase === 'lobby') lastKey = '';
}

$('#leave').addEventListener('click', () => { if (confirm('Odadan çıkmak istiyor musun?')) send({ t: 'leave' }); });
render();
connect();
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const canvas = document.getElementById('worldCanvas');
const host = document.getElementById('world3d');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.78;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1c21, 0.035);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 250);
camera.position.set(17, 11, 20);

scene.add(new THREE.HemisphereLight(0x9eb7bb, 0x061013, 1.5));
const moon = new THREE.DirectionalLight(0xb8d4d7, 1.35);
moon.position.set(-12,24,8); moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024); moon.shadow.camera.left=-35; moon.shadow.camera.right=35; moon.shadow.camera.top=35; moon.shadow.camera.bottom=-35;
scene.add(moon);

const warm = new THREE.PointLight(0xffc96e, 5.5, 24, 2);
warm.position.set(0,8.3,0); scene.add(warm);

// Ocean
const oceanGeo = new THREE.PlaneGeometry(180,180,70,70);
const oceanMat = new THREE.MeshStandardMaterial({color:0x0a2a31,roughness:.2,metalness:.35,transparent:true,opacity:.9});
const ocean = new THREE.Mesh(oceanGeo,oceanMat); ocean.rotation.x=-Math.PI/2; ocean.position.y=-1.5; ocean.receiveShadow=true; scene.add(ocean);
const oceanBase = ocean.geometry.attributes.position.array.slice();

// Island
const islandGeo = new THREE.CylinderGeometry(8.5,11,2.5,48,3);
const islandMat = new THREE.MeshStandardMaterial({color:0x263b36,roughness:1});
const island = new THREE.Mesh(islandGeo,islandMat); island.position.y=-.25; island.scale.z=.82; island.receiveShadow=true; island.castShadow=true; scene.add(island);

// Hills
function rock(x,y,z,sx,sy,sz,rot=0){
  const g=new THREE.DodecahedronGeometry(1,1),m=new THREE.MeshStandardMaterial({color:0x243b38,roughness:1});
  const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.rotation.y=rot;o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
rock(-4,1.8,-2,3.2,2.7,2.4,.2); rock(3.7,1.5,-2.7,3.4,2.4,2.1,1.4); rock(4.2,1.1,3.5,2.5,1.8,2.0,.7); rock(-4.5,1.2,3.1,2.7,2.0,2.3,2.1);

// Lighthouse tower
const towerMat=new THREE.MeshStandardMaterial({color:0x8b8172,roughness:.8});
const tower=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.7,9,32),towerMat);tower.position.set(0,5.2,0);tower.castShadow=true;tower.receiveShadow=true;scene.add(tower);
const stripeMat=new THREE.MeshStandardMaterial({color:0x293136,roughness:.8});
for(let i=0;i<4;i++){const band=new THREE.Mesh(new THREE.CylinderGeometry(1.27-i*.03,1.58-i*.04,.45,32),stripeMat);band.position.set(0,2.2+i*1.8,0);scene.add(band)}
const cap=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,.35,32),stripeMat);cap.position.set(0,9.8,0);scene.add(cap);
const roof=new THREE.Mesh(new THREE.ConeGeometry(1.8,1.6,32),new THREE.MeshStandardMaterial({color:0x161c20,roughness:.65}));roof.position.set(0,10.75,0);scene.add(roof);
const lamp=new THREE.Mesh(new THREE.SphereGeometry(.38,20,20),new THREE.MeshStandardMaterial({color:0xffd47a,emissive:0xffa72b,emissiveIntensity:7}));lamp.position.set(0,9.75,0);scene.add(lamp);

// Lighthouse glass room
const glass=new THREE.Mesh(new THREE.CylinderGeometry(1.38,1.38,1.35,32,1,true),new THREE.MeshPhysicalMaterial({color:0x9dd7d7,transparent:true,opacity:.18,roughness:.05,metalness:.1,side:THREE.DoubleSide}));glass.position.set(0,9.75,0);scene.add(glass);

// Beam
const beamGeo=new THREE.CylinderGeometry(.2,7.2,24,32,1,true); // elongated cone-like volume
const beamMat=new THREE.MeshBasicMaterial({color:0xffd98a,transparent:true,opacity:.055,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
const beam=new THREE.Mesh(beamGeo,beamMat);beam.rotation.z=Math.PI/2;beam.position.set(0,9.75,-10);scene.add(beam);
const beamLight=new THREE.SpotLight(0xffd98a,4,70,0.16,0.65,1.2);beamLight.position.set(0,9.75,0);beamLight.target.position.set(0,9.75,-30);scene.add(beamLight,beamLight.target);

// Small windows
const winMat=new THREE.MeshStandardMaterial({color:0x1a2528,emissive:0xffb95a,emissiveIntensity:2});
for(let i=0;i<4;i++){const w=new THREE.Mesh(new THREE.BoxGeometry(.34,1.0,.1),winMat);const a=i*Math.PI/2;w.position.set(Math.sin(a)*1.28,4.2,Math.cos(a)*1.28);w.lookAt(0,4.2,0);scene.add(w)}

// Floating fog sprites
const fogMat=new THREE.MeshBasicMaterial({color:0xbad0cc,transparent:true,opacity:.055,depthWrite:false});
const fogs=[];
for(let i=0;i<18;i++){const f=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random()*3,16,8),fogMat.clone());f.scale.y=.25;f.position.set((Math.random()-.5)*35,Math.random()*8-1,(Math.random()-.5)*35);f.userData={speed:.08+Math.random()*.12,phase:Math.random()*10};scene.add(f);fogs.push(f)}

// A few dead trees
const trunkMat=new THREE.MeshStandardMaterial({color:0x171b1a,roughness:1});
for(let i=0;i<12;i++){
  const a=Math.random()*Math.PI*2, r=4.5+Math.random()*4; const t=new THREE.Mesh(new THREE.CylinderGeometry(.12,.25,2+Math.random()*2,7),trunkMat);
  t.position.set(Math.cos(a)*r,-.1,Math.sin(a)*r*.82);t.rotation.z=(Math.random()-.5)*.35;t.castShadow=true;scene.add(t);
}

let mouseX=0,mouseY=0;
addEventListener('pointermove',e=>{mouseX=(e.clientX/innerWidth-.5)*2;mouseY=(e.clientY/innerHeight-.5)*2});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});

let lastPhase='lobby';
function gamePhase(){try{return window.__SA_GET_STATE?.()?.phase || 'lobby'}catch{return 'lobby'}}
function animate(ms){
  requestAnimationFrame(animate);
  const t=ms*.001;
  const phase=gamePhase();
  const intensity=phase==='play'?1:phase==='end'?.7:.55;
  warm.intensity=5.5*intensity;
  beam.rotation.y=t*.32;
  beamLight.target.position.x=Math.sin(t*.32)*22;
  beamLight.target.position.z=Math.cos(t*.32)*22;
  lamp.material.emissiveIntensity=5+Math.sin(t*2.5)*1.5;
  ocean.geometry.attributes.position.array.forEach; // keep geometry alive
  const pos=ocean.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){const x=oceanBase[i*3],z=oceanBase[i*3+2];pos.setY(i,-1.5+Math.sin(x*.09+t*.8)*.12+Math.cos(z*.11+t*.55)*.1)}
  pos.needsUpdate=true;ocean.geometry.computeVertexNormals();
  fogs.forEach((f,i)=>{f.position.x+=Math.sin(t*.07+f.userData.phase)*.006;f.position.z+=f.userData.speed*.012;if(f.position.z>25)f.position.z=-25});
  const target=new THREE.Vector3(0,4,0);
  const desiredX=17+mouseX*3,desiredZ=20+mouseY*2;
  camera.position.x += (desiredX-camera.position.x)*.015;
  camera.position.z += (desiredZ-camera.position.z)*.015;
  camera.position.y += ((11+Math.sin(t*.18)*.35)-camera.position.y)*.015;
  camera.lookAt(target);
  host.style.filter=phase==='end'?'saturate(.75)':'none';
  renderer.render(scene,camera);
}
animate(0);
</script>
</body>
</html>
